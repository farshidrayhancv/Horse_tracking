# Simplified Racer Detection Configuration
# Single Roboflow model detects horse+jockey as compound entity

# Basic Settings
video_path: 'inputs/horse_8.mp4'
output_path: null
display: false
device: 'cuda'
max_frames: null

# Roboflow Configuration
roboflow_api_key: 'wFo5HAaMOWxmTBCubny1'
roboflow_model_id: 'del_mar_pan_seg-mdxam/1'
roboflow_confidence: 0.5

# Pose Estimation - Run on compound racer entities
horse_pose_estimator: 'both'  # superanimal, vitpose, both
confidence_horse_pose_superanimal: 0.5
confidence_horse_pose_vitpose: 0.5

# Tracking Configuration - Track compound racers
tracker_type: 'deepocsort'

# Deep OC-SORT Configuration for Compound Entities
deepocsort_config:
  # === CORE TRACKING ===
  max_age: 30
  min_hits: 2
  det_thresh: 0.4
  iou_threshold: 0.4
  per_class: false
  
  # === KALMAN FILTER STABILITY ===
  delta_t: 3
  inertia: 0.3
  Q_xy_scaling: 0.01
  Q_s_scaling: 0.0001
  
  # === ASSOCIATION ===
  asso_func: "iou"
  w_association_emb: 0.6
  alpha_fixed_emb: 0.9
  aw_param: 0.5
  
  # === FEATURES ===
  embedding_off: true
  cmc_off: false
  aw_off: false

# ReID Configuration - MegaDescriptor on compound entities
enable_reid: true
reid_similarity_threshold: 0.6
reid_memory_size: 8

# Performance
max_racers: 15

# === SYSTEM ADVANTAGES ===
# 1. Single API Call: Roboflow detects horse+jockey as one entity
# 2. Built-in Segmentation: No need for SAM/MobileSAM
# 3. Simplified Tracking: Track compound entities, not separate objects
# 4. Dual Pose Overlay: SuperAnimal + ViTPose on same bounding box
# 5. Cleaner ReID: MegaDescriptor on compound visual signatures
# 6. Reduced Complexity: No SigLIP, no OCR, no detection coordination